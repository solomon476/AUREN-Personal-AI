<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#141722" />
      <stop offset="60%" stop-color="#0c0e14" />
      <stop offset="100%" stop-color="#08090c" />
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff2d4" />
      <stop offset="25%" stop-color="#f2d599" />
      <stop offset="55%" stop-color="#d7ba83" />
      <stop offset="85%" stop-color="#9a7238" />
      <stop offset="100%" stop-color="#64431e" />
    </linearGradient>
    <linearGradient id="facetDark" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a67c3b" />
      <stop offset="100%" stop-color="#553a1a" />
    </linearGradient>
    <linearGradient id="orbitGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6c4327" stop-opacity="0.2" />
      <stop offset="20%" stop-color="#d7ba83" />
      <stop offset="50%" stop-color="#fff2d4" />
      <stop offset="80%" stop-color="#d7ba83" />
      <stop offset="100%" stop-color="#9a7238" stop-opacity="0.1" />
    </linearGradient>
    <filter id="haloGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background tile -->
  <rect width="128" height="128" rx="28" fill="url(#bgGrad)" />
  <rect width="126" height="126" x="1" y="1" rx="27" fill="none" stroke="#d7ba83" stroke-width="1" stroke-opacity="0.18" />

  <!-- Outer ambient ring glow -->
  <ellipse cx="64" cy="56" rx="42" ry="42" fill="none" stroke="#d7ba83" stroke-width="1.5" stroke-opacity="0.2" />

  <!-- Orbital swoosh path behind apex -->
  <path d="M 22 78 C 30 46, 98 42, 108 58" fill="none" stroke="url(#orbitGrad)" stroke-width="2.2" stroke-linecap="round" stroke-opacity="0.4" />

  <!-- Stylized 'A' Left Facet -->
  <path d="M 64 22 L 30 102 L 44 102 L 64 48 Z" fill="url(#goldGrad)" filter="url(#haloGlow)" />
  <!-- Stylized 'A' Right Facet -->
  <path d="M 64 22 L 64 48 L 84 102 L 98 102 Z" fill="url(#facetDark)" />

  <!-- Center Crossbar Horizon -->
  <polygon points="46,72 82,72 78,76 50,76" fill="#d7ba83" />

  <!-- Radiant 4-point Star -->
  <g transform="translate(64, 69)">
    <polygon points="0,-12 3,-3 12,0 3,3 0,12 -3,3 -12,0 -3,-3" fill="#ffffff" />
    <circle cx="0" cy="0" r="2" fill="#fff7e0" />
  </g>

  <!-- Front Orbital Swoosh -->
  <path d="M 16 88 C 24 74, 52 64, 82 66 C 102 67, 114 74, 110 82 C 104 92, 80 96, 56 94" fill="none" stroke="url(#orbitGrad)" stroke-width="2.5" stroke-linecap="round" filter="url(#haloGlow)" />
</svg>

